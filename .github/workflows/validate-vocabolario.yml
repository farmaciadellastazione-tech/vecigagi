name: Valida vocabolario

# Controlla l'integrità di VOCABOLARIO_DEFAULT in index.html:
# colonne disallineate, chiavi/valori invalidi, verif/src malformati.
# Blocca il merge se trova ERRORI (i warning di qualità non bloccano).

on:
  push:
    paths:
      - 'index.html'
      - 'tools/validate_vocabolario.mjs'
      - '.github/workflows/validate-vocabolario.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tools/validate_vocabolario.mjs'
      - '.github/workflows/validate-vocabolario.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Valida il vocabolario
        run: npm run validate:voc
